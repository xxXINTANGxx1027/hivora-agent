services:
  - type: web
    name: hivora-agent-stage
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # 打开生产守卫：缺 DATABASE_URL / SECRET_KEY / ALLOWED_ORIGINS 或弱管理员口令时拒绝启动
      - key: HIVORA_ENV
        value: production
      # ⚠️ 必须 ≥32 字符。Render 自动生成后到 Dashboard 确认一下长度，不够就自己贴
      # （openssl rand -hex 32）。换掉这个值会让所有人重新登录。
      - key: SECRET_KEY
        generateValue: true
      # Neon Postgres 连接串。不贴 = 拒绝启动（原来会静默退回 SQLite，重启丢数据）
      - key: DATABASE_URL
        sync: false
      # 允许的前端域名，逗号分隔。不能是 *
      - key: ALLOWED_ORIGINS
        value: https://hivora-frontend.vercel.app
      # 首次部署用来创建管理员。密码 ≥10 位且不能是常见口令，否则拒绝启动。
      # 管理员建好之后：留空 → 保持现有密码不变；填新值 → 下次启动改成新密码。
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v3.2
      # 登录有效期（天）
      - key: TOKEN_TTL_DAYS
        value: "14"
      # 错误监控：填了 DSN 才启用，不填完全不引入
      - key: SENTRY_DSN
        sync: false
      # 每账号每月 token 上限（管理站可按账号覆盖）
      - key: MONTHLY_TOKEN_QUOTA
        value: "2000000"
      # 成本估算单价（美元/百万 token），换模型记得改
      - key: PRICE_PER_MTOK_IN
        value: "0.28"
      - key: PRICE_PER_MTOK_OUT
        value: "0.42"
